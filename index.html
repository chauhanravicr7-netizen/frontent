<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCKSIDE | Timber Trading ERP v12.1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS REMAINS UNCHANGED AS PER INSTRUCTIONS TO PRESERVE DESIGN */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f5; color: #333; }
        .layout { display: flex; height: 100vh; }
        .sidebar { width: 240px; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar-brand { font-size: 16px; font-weight: 900; margin-bottom: 10px; }
        .sidebar-subtitle { font-size: 11px; color: #999; margin-bottom: 30px; }
        .sidebar-nav { flex: 1; }
        .nav-item { padding: 12px 15px; margin-bottom: 5px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #999; border-left: 3px solid transparent; transition: all 0.2s; }
        .nav-item:hover { color: white; }
        .nav-item.active { color: white; background-color: #d97706; border-left-color: #d97706; }
        .sidebar-footer { border-top: 1px solid #333; padding-top: 15px; }
        .btn-primary { padding: 10px 24px; background-color: #0066cc; color: white; border: none; border-radius: 3px; font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background-color: #0052a3; }
        .btn-secondary { padding: 10px 24px; background-color: #10b981; color: white; border: none; border-radius: 3px; font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .btn-secondary:hover { background-color: #059669; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background-color: white; border-bottom: 1px solid #e5e5e5; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 14px; font-weight: 900; color: #1a1a1a; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .page-title { font-size: 24px; font-weight: 900; margin-bottom: 25px; color: #1a1a1a; }
        .control-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-bottom: 30px; background-color: white; padding: 20px; border: 1px solid #e5e5e5; border-radius: 3px; }
        .control-item { text-align: center; }
        .control-label { font-size: 10px; color: #999; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .control-value { font-size: 22px; font-weight: 900; color: #1a1a1a; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; align-items: center; background-color: white; padding: 15px; border: 1px solid #e5e5e5; border-radius: 3px; }
        .table-wrapper { background-color: white; border: 1px solid #e5e5e5; border-radius: 3px; overflow: hidden; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background-color: #f9f9f9; padding: 10px 12px; text-align: left; font-weight: 700; color: #666; border-bottom: 1px solid #e5e5e5; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        .badge { display: inline-block; padding: 3px 7px; border-radius: 3px; font-size: 9px; font-weight: 600; }
        .badge-transit { background-color: #dbeafe; color: #1e40af; }
        .badge-delayed { background-color: #fee2e2; color: #991b1b; }
        .badge-completed { background-color: #dcfce7; color: #15803d; }
        .badge-critical { background-color: #fee2e2; color: #991b1b; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 95%; max-width: 1000px; max-height: 90vh; overflow-y: auto; border-radius: 4px; }
        .panel { background: white; border: 1px solid #e5e5e5; border-left: 4px solid #0066cc; border-radius: 3px; padding: 15px; margin-bottom: 15px; }
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 11px; border-bottom: 1px solid #f0f0f0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="loginPage" class="fixed inset-0 flex bg-neutral-900 z-[200]">
    <div class="flex-1 flex items-center justify-center p-12 text-white">
        <div>
            <h1 class="text-6xl font-black mb-4">DOCKSIDE</h1>
            <p class="text-neutral-400">Professional Timber Trading ERP v12.1.0</p>
        </div>
    </div>
    <div class="flex-1 bg-gray-100 flex items-center justify-center p-12">
        <div class="bg-white p-10 rounded shadow-xl w-full max-w-sm">
            <h2 class="text-2xl font-black mb-6">Login</h2>
            <input type="email" id="loginEmail" class="w-full border p-3 rounded mb-4" value="admin@dockside.com">
            <input type="password" id="loginPassword" class="w-full border p-3 rounded mb-6" value="demo123456">
            <button class="w-full bg-blue-600 text-white font-bold py-3 rounded" onclick="handleLogin()">Login Terminal</button>
        </div>
    </div>
</div>

<div id="mainApp" class="layout hidden">
    <div class="sidebar">
        <div class="sidebar-brand">DOCKSIDE</div>
        <div class="sidebar-subtitle">v12.1.0 ERP</div>
        <div class="sidebar-nav" id="nav"></div>
        <div class="sidebar-footer">
            <p class="text-[10px] text-neutral-500 uppercase font-bold tracking-widest text-center">System Status: Live</p>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div class="header-title" id="pageTitle">Dashboard</div>
            <div class="header-right">
                <span class="text-[11px] text-gray-400 uppercase font-bold" id="userDisplay">Admin</span>
                <button class="bg-red-600 text-white px-4 py-1 rounded text-[10px] font-bold" onclick="handleLogout()">LOGOUT</button>
            </div>
        </div>
        <div class="content" id="content"></div>
    </div>
</div>

<div id="inventoryModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">📦 Add New Cargo to Inventory</div>
            <button class="close-btn" onclick="closeInventoryModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <div class="form-group"><label class="form-label">SKU Code *</label><input type="text" id="invSKU"></div>
                <div class="form-group"><label class="form-label">Product Name *</label><input type="text" id="invProduct"></div>
                <div class="form-group"><label class="form-label">Batch Number *</label><input type="text" id="invBatch"></div>
                <div class="form-group"><label class="form-label">Supplier *</label><input type="text" id="invSupplier"></div>
                <div class="form-group"><label class="form-label">Yard Location *</label><select id="invLocation"><option value="Plot10-A1">Plot 10 - A1</option><option value="Plot12-B1">Plot 12 - B1</option></select></div>
                <div class="form-group"><label class="form-label">Quantity *</label><input type="number" id="invQty"></div>
                <div class="form-group"><label class="form-label">Purchase Rate (₹) *</label><input type="number" id="invPurchaseRate"></div>
                <div class="form-group"><label class="form-label">Landed Cost (₹) *</label><input type="number" id="invLandedCost"></div>
                <div class="form-group"><label class="form-label">Movement Date *</label><input type="date" id="invMovement"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeInventoryModal()">Cancel</button>
            <button class="btn btn-save" onclick="saveInventory()">Add to Inventory</button>
        </div>
    </div>
</div>

<div id="dispatchModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">🚚 Create New Shipment</div>
            <button class="close-btn" onclick="closeDispatchModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <div class="form-group"><label class="form-label">Vehicle Number *</label><input type="text" id="dispatchVehicle"></div>
                <div class="form-group"><label class="form-label">Driver Name *</label><input type="text" id="dispatchDriver"></div>
                <div class="form-group"><label class="form-label">Supplier *</label><input type="text" id="dispatchSupplier"></div>
                <div class="form-group"><label class="form-label">Origin *</label><input type="text" id="dispatchOrigin"></div>
                <div class="form-group"><label class="form-label">Dispatch Date *</label><input type="date" id="dispatchDate"></div>
                <div class="form-group"><label class="form-label">Port Arrival Date *</label><input type="date" id="portArrivalDate"></div>
                <div class="form-group"><label class="form-label">Shipment Value (₹) *</label><input type="number" id="dispatchValue"></div>
                <div class="form-group"><label class="form-label">Freight (₹) *</label><input type="number" id="dispatchFreight"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeDispatchModal()">Cancel</button>
            <button class="btn btn-save" onclick="saveDispatch()">Create Shipment</button>
        </div>
    </div>
</div>

<div id="shipmentModal" class="modal">
    <div class="modal-box" id="shipmentContent"></div>
</div>

<script>
// ============== DATABASE & HELPERS ==============
const db = {
    inventory: [
        { sku: 'PLY-001', product: 'Plywood 12mm', supplier: 'Tamil Nadu', location: 'Plot10-A1', batch: 'B-01', qty: 450, purchaseRate: 2000, landedCost: 925000, movement: '2025-02-20' },
        { sku: 'TIM-001', product: 'Teak Logs', supplier: 'Kerala Timber', location: 'Plot12-B2', batch: 'B-02', qty: 320, purchaseRate: 5000, landedCost: 1650000, movement: '2025-01-10' }
    ],
    shipments: [
        { id: 'SHIP-01', vehicle: 'MH-01-XY-1234', driver: 'Rajesh', origin: 'Port Cochin', dispatchDate: '2025-03-01', portArrivalDate: '2025-02-20', value: 850000, freight: 25000, status: 'In Transit', timeline: [] }
    ]
};

// HELPER: Auto-calculate Days
const getDaysBetween = (startDate) => {
    const start = new Date(startDate);
    const today = new Date();
    return Math.floor((today - start) / (1000 * 60 * 60 * 24));
};

// ============== NAVIGATION & ROUTING ==============
function switchView(view) {
    state.view = view;
    loadNav();
    const content = document.getElementById('content');
    if (view === 'dashboard') renderDashboard();
    else if (view === 'inventory') renderInventory();
    else if (view === 'transit-timeline') renderTransit();
}

function loadNav() {
    const items = ['Dashboard', 'Inventory', 'Transit Timeline'];
    document.getElementById('nav').innerHTML = items.map(item => {
        const v = item.toLowerCase().replace(/ /g, '-');
        return `<div class="nav-item ${state.view === v ? 'active' : ''}" onclick="switchView('${v}')">${item}</div>`;
    }).join('');
}

// ============== INVENTORY PAGE ==============
function renderInventory() {
    document.getElementById('pageTitle').textContent = 'Inventory Management';
    
    let html = `
        <div class="filter-bar">
            <button class="btn-secondary" onclick="openInventoryModal()">+ Add Cargo</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>SKU</th><th>Product</th><th>Supplier</th><th>Location</th><th>Batch</th><th>Qty</th><th>Purch Rate</th><th>Landed Cost</th><th>Movement</th><th>Days in Yard</th>
                    </tr>
                </thead>
                <tbody>
    `;

    db.inventory.forEach(item => {
        const days = getDaysBetween(item.movement);
        html += `
            <tr class="${days > 60 ? 'row-risk-medium' : ''}">
                <td><strong>${item.sku}</strong></td><td>${item.product}</td><td>${item.supplier}</td><td>${item.location}</td><td>${item.batch}</td>
                <td>${item.qty}</td><td>₹${item.purchaseRate}</td><td>₹${item.landedCost}</td><td>${item.movement}</td><td>${days}d</td>
            </tr>
        `;
    });

    html += `</tbody></table></div>`;
    document.getElementById('content').innerHTML = html;
}

function saveInventory() {
    const data = {
        sku: document.getElementById('invSKU').value,
        product: document.getElementById('invProduct').value,
        batch: document.getElementById('invBatch').value,
        supplier: document.getElementById('invSupplier').value,
        location: document.getElementById('invLocation').value,
        qty: parseFloat(document.getElementById('invQty').value),
        purchaseRate: parseFloat(document.getElementById('invPurchaseRate').value),
        landedCost: parseFloat(document.getElementById('invLandedCost').value),
        movement: document.getElementById('invMovement').value
    };

    if (!data.sku || !data.qty || !data.purchaseRate || !data.movement) {
        alert("❌ Please fill all required fields");
        return;
    }

    db.inventory.push(data);
    closeInventoryModal();
    alert("✓ Cargo added to inventory!");
    renderInventory();
}

// ============== TRANSIT TIMELINE ==============
function renderTransit() {
    document.getElementById('pageTitle').textContent = 'Transit Timeline';
    
    let html = `
        <div class="filter-bar">
            <input type="text" id="transitSearch" placeholder="Search Vehicle / Driver / Origin" onkeyup="filterTransit()" style="width: 300px; margin-right: 20px;">
            <button class="btn-primary" onclick="openDispatchModal()">+ Create Dispatch</button>
        </div>
        <div class="table-wrapper">
            <table id="transitTable">
                <thead>
                    <tr><th>ID</th><th>Vehicle</th><th>Driver</th><th>Origin</th><th>Dispatch</th><th>Port Arrival</th><th>Days in Port</th><th>Value</th><th>Status</th><th>Demurrage</th></tr>
                </thead>
                <tbody>
    `;

    db.shipments.forEach(ship => {
        const dip = getDaysBetween(ship.portArrivalDate);
        const statusBadge = ship.status === 'In Transit' ? 'badge-transit' : 'badge-completed';
        
        html += `
            <tr onclick="openShipmentDetail('${ship.id}')">
                <td><strong>${ship.id}</strong></td><td>${ship.vehicle}</td><td>${ship.driver}</td><td>${ship.origin}</td>
                <td>${ship.dispatchDate}</td><td>${ship.portArrivalDate}</td><td>${dip}d</td><td>₹${ship.value.toLocaleString()}</td>
                <td><span class="badge ${statusBadge}">${ship.status}</span></td>
                <td>${dip > 7 ? `<span class="badge badge-critical">CRITICAL ${dip}d</span>` : '—'}</td>
            </tr>
        `;
    });

    html += `</tbody></table></div>`;
    document.getElementById('content').innerHTML = html;
}

function filterTransit() {
    const term = document.getElementById('transitSearch').value.toLowerCase();
    const rows = document.querySelectorAll('#transitTable tbody tr');
    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(term) ? '' : 'none';
    });
}

// ============== SHIPMENT STATUS & MODALS ==============
function openShipmentDetail(id) {
    const ship = db.shipments.find(s => s.id === id);
    const dip = getDaysBetween(ship.portArrivalDate);
    
    document.getElementById('shipmentContent').innerHTML = `
        <div class="modal-header">
            <div class="modal-title">Shipment: ${ship.id}</div>
            <button class="close-btn" onclick="closeShipmentModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="panel">
                <div class="detail-row"><span class="detail-label">Vehicle</span><span class="detail-value">${ship.vehicle}</span></div>
                <div class="detail-row"><span class="detail-label">Driver</span><span class="detail-value">${ship.driver}</span></div>
                <div class="detail-row">
                    <span class="detail-label">Update Status:</span>
                    <select onchange="updateShipmentStatus('${ship.id}', this.value)">
                        <option ${ship.status === 'In Transit' ? 'selected' : ''}>In Transit</option>
                        <option ${ship.status === 'Arrived' ? 'selected' : ''}>Arrived</option>
                        <option ${ship.status === 'Completed' ? 'selected' : ''}>Completed</option>
                        <option ${ship.status === 'Delayed' ? 'selected' : ''}>Delayed</option>
                    </select>
                </div>
            </div>
            <div class="panel" style="border-left-color: ${dip > 7 ? '#dc2626' : '#10b981'}">
                <div class="detail-row"><span class="detail-label">Days in Port</span><span class="detail-value">${dip} days</span></div>
                <div class="detail-row"><span class="detail-label">Demurrage Risk</span><span class="detail-value">${dip > 7 ? 'HIGH' : 'LOW'}</span></div>
            </div>
        </div>
    `;
    document.getElementById('shipmentModal').classList.add('show');
}

function updateShipmentStatus(id, newStatus) {
    const ship = db.shipments.find(s => s.id === id);
    if (ship) {
        ship.status = newStatus;
        alert(`✓ Status updated to ${newStatus}`);
        closeShipmentModal();
        renderTransit();
    }
}

// ============== INITIALIZATION & AUTH (Preserved) ==============
const state = { view: 'dashboard', authenticated: false };

function handleLogin() {
    const email = document.getElementById('loginEmail').value;
    if (email === 'admin@dockside.com') {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        switchView('dashboard');
    }
}

function handleLogout() { location.reload(); }

// DASHBOARD KPI (Simplified for Instructions)
function renderDashboard() {
    const totalValue = db.inventory.reduce((s,i) => s + i.landedCost, 0);
    document.getElementById('content').innerHTML = `
        <div class="page-title">Dashboard Overview</div>
        <div class="grid-4">
            <div class="card"><div class="card-label">Total Inventory</div><div class="card-value">₹${(totalValue/100000).toFixed(1)}L</div></div>
            <div class="card"><div class="card-label">Active Shipments</div><div class="card-value">${db.shipments.length}</div></div>
            <div class="card" style="border: 1px solid #dc2626;"><div class="card-label">90+ Day Risk</div><div class="card-value">₹0.0L</div></div>
        </div>
    `;
}

// MODAL CONTROLS
function openInventoryModal() { document.getElementById('inventoryModal').classList.add('show'); document.getElementById('invMovement').valueAsDate = new Date(); }
function closeInventoryModal() { document.getElementById('inventoryModal').classList.remove('show'); }
function openDispatchModal() { document.getElementById('dispatchModal').classList.add('show'); document.getElementById('dispatchDate').valueAsDate = new Date(); }
function closeDispatchModal() { document.getElementById('dispatchModal').classList.remove('show'); }
function closeShipmentModal() { document.getElementById('shipmentModal').classList.remove('show'); }

window.onload = loadNav;
</script>
</body>
</html>
