<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCKSIDE | Timber Trading ERP v10.0.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f5; color: #333; }
        .layout { display: flex; height: 100vh; }
        .sidebar { width: 240px; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; padding: 20px; }
        .sidebar-brand { font-size: 16px; font-weight: 900; margin-bottom: 10px; }
        .sidebar-subtitle { font-size: 11px; color: #999; margin-bottom: 30px; }
        .sidebar-nav { flex: 1; }
        .nav-item { padding: 12px 15px; margin-bottom: 5px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #999; border-left: 3px solid transparent; }
        .nav-item:hover { color: white; }
        .nav-item.active { color: white; background-color: #d97706; border-left-color: #d97706; }
        .sidebar-footer { border-top: 1px solid #333; padding-top: 15px; }
        .btn-primary { width: 100%; padding: 10px; background-color: #0066cc; color: white; border: none; border-radius: 3px; font-weight: 600; font-size: 11px; cursor: pointer; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background-color: white; border-bottom: 1px solid #e5e5e5; padding: 15px 30px; }
        .header-title { font-size: 14px; font-weight: 900; color: #1a1a1a; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .page-title { font-size: 24px; font-weight: 900; margin-bottom: 25px; color: #1a1a1a; }
        .control-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-bottom: 30px; background-color: white; padding: 20px; border: 1px solid #e5e5e5; border-radius: 3px; }
        .control-item { text-align: center; }
        .control-label { font-size: 10px; color: #999; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .control-value { font-size: 22px; font-weight: 900; color: #1a1a1a; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; background-color: white; padding: 15px; border: 1px solid #e5e5e5; border-radius: 3px; }
        .filter-group { display: flex; gap: 6px; align-items: center; }
        .filter-label { font-size: 10px; color: #999; font-weight: 600; text-transform: uppercase; }
        input, select { padding: 7px 10px; border: 1px solid #ddd; border-radius: 3px; font-size: 11px; font-family: inherit; background-color: white; }
        input:focus, select:focus { outline: none; border-color: #0066cc; }
        .table-wrapper { background-color: white; border: 1px solid #e5e5e5; border-radius: 3px; overflow: hidden; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background-color: #f9f9f9; padding: 10px 12px; text-align: left; font-weight: 700; color: #666; border-bottom: 1px solid #e5e5e5; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        tr:hover { background-color: #fafafa; cursor: pointer; }
        .badge { display: inline-block; padding: 3px 7px; border-radius: 3px; font-size: 9px; font-weight: 600; }
        .badge-transit { background-color: #dbeafe; color: #1e40af; }
        .badge-delayed { background-color: #fee2e2; color: #991b1b; }
        .badge-completed { background-color: #dcfce7; color: #15803d; }
        .badge-arrived { background-color: #fed7aa; color: #92400e; }
        .row-risk-high { background-color: #fee2e2; }
        .row-risk-medium { background-color: #fed7aa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 95%; max-width: 1200px; max-height: 90vh; overflow-y: auto; border-radius: 3px; display: flex; flex-direction: column; }
        .modal-header { padding: 20px; border-bottom: 1px solid #e5e5e5; background-color: #fafafa; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 14px; font-weight: 900; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
        .modal-body { padding: 25px; flex: 1; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-label { font-size: 11px; font-weight: 600; margin-bottom: 5px; color: #333; }
        .modal-footer { padding: 15px 25px; border-top: 1px solid #e5e5e5; background-color: #fafafa; display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 8px 16px; border: none; border-radius: 3px; font-weight: 600; font-size: 11px; cursor: pointer; }
        .btn-cancel { background-color: #e5e5e5; color: #333; }
        .btn-save { background-color: #0066cc; color: white; }
        .panel { background: white; border: 1px solid #e5e5e5; border-radius: 3px; padding: 15px; margin-bottom: 15px; }
        .panel-title { font-size: 12px; font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #e5e5e5; }
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 11px; border-bottom: 1px solid #f0f0f0; }
        .detail-label { color: #999; font-weight: 600; }
        .detail-value { color: #1a1a1a; font-weight: 500; }
        .alert-section { background: white; border: 1px solid #e5e5e5; border-radius: 3px; padding: 20px; }
        .alert-title { font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .alert-item { padding: 10px; background-color: #fee2e2; border-left: 3px solid #dc2626; margin-bottom: 8px; font-size: 11px; border-radius: 2px; }
        .alert-item.good { background-color: #dcfce7; border-left-color: #10b981; color: #15803d; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .card { background: white; border: 1px solid #e5e5e5; border-radius: 3px; padding: 20px; text-align: center; }
        .card-label { font-size: 10px; color: #999; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .card-value { font-size: 22px; font-weight: 900; color: #1a1a1a; margin-bottom: 8px; }
        .card-chart { height: 35px; background: linear-gradient(to right, #dbeafe, #bfdbfe); border-radius: 3px; }
        .card-subtitle { font-size: 10px; color: #999; margin-top: 8px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-brand">DOCKSIDE</div>
        <div class="sidebar-subtitle">Timber Trading ERP</div>
        <div class="sidebar-nav" id="nav"></div>
        <div class="sidebar-footer">
            <button class="btn-primary" onclick="openDispatchModal()">+ New Shipment</button>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div class="header-title" id="pageTitle">Dashboard</div>
        </div>
        <div class="content" id="content"></div>
    </div>
</div>

<!-- DISPATCH MODAL -->
<div id="dispatchModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Create New Shipment</div>
            <button class="close-btn" onclick="closeDispatchModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <div class="form-group"><label class="form-label">Vehicle Number *</label><input type="text" id="dispatchVehicle" placeholder="MH-01-XY-1234"></div>
                <div class="form-group"><label class="form-label">Driver Name *</label><input type="text" id="dispatchDriver"></div>
                <div class="form-group"><label class="form-label">Driver Contact *</label><input type="text" id="dispatchContact"></div>
                <div class="form-group"><label class="form-label">Supplier *</label><input type="text" id="dispatchSupplier"></div>
                <div class="form-group"><label class="form-label">Cargo Type *</label><select id="dispatchCargo"><option>Timber Logs</option><option>Plywood</option><option>Sawn Timber</option></select></div>
                <div class="form-group"><label class="form-label">Origin *</label><input type="text" id="dispatchOrigin"></div>
                <div class="form-group"><label class="form-label">Destination Yard *</label><select id="dispatchDest"><option>Plot 10</option><option>Plot 12</option><option>Plot 15</option></select></div>
                <div class="form-group"><label class="form-label">Dispatch Date *</label><input type="date" id="dispatchDate"></div>
                <div class="form-group"><label class="form-label">ETA (Days) *</label><input type="number" id="dispatchETA" value="5"></div>
                <div class="form-group"><label class="form-label">Shipment Value (₹) *</label><input type="number" id="dispatchValue"></div>
                <div class="form-group"><label class="form-label">Freight Cost (₹) *</label><input type="number" id="dispatchFreight"></div>
                <div class="form-group"><label class="form-label">Clearing Cost (₹)</label><input type="number" id="dispatchClearing" value="0"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeDispatchModal()">Cancel</button>
            <button class="btn btn-save" onclick="saveDispatch()">Create Shipment</button>
        </div>
    </div>
</div>

<!-- SHIPMENT DETAILS MODAL -->
<div id="shipmentModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="shipmentModalTitle">Shipment Details</div>
            <button class="close-btn" onclick="closeShipmentModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="two-col" id="shipmentContent"></div>
        </div>
    </div>
</div>

<script>
const db = {
    shipments: [
        { id: 'SHIP-001', vehicle: 'MH-01-XY-1234', driver: 'Rajesh Kumar', contact: '+91 9876543210', cargo: 'Timber Logs', supplier: 'Kerala Timber', origin: 'Port Cochin', destination: 'Plot 10', dispatchDate: '2025-03-01', eta: 5, value: 850000, freight: 25000, clearing: 5000, status: 'In Transit', gpsStatus: 'Active', syncStatus: 'Not Synced', delay: 0, timeline: [{ event: 'Dispatch', date: '2025-03-01', time: '08:00' }, { event: 'En route', date: '2025-03-02', time: '14:30' }] },
        { id: 'SHIP-002', vehicle: 'MH-02-AB-5678', driver: 'Suresh Singh', contact: '+91 8765432109', cargo: 'Plywood', supplier: 'Tamil Nadu Ply', origin: 'Trichy', destination: 'Plot 12', dispatchDate: '2025-02-28', eta: 4, value: 620000, freight: 18000, clearing: 3000, status: 'Delayed', gpsStatus: 'Inactive', syncStatus: 'Not Synced', delay: 2, timeline: [{ event: 'Dispatch', date: '2025-02-28', time: '10:00' }, { event: 'En route', date: '2025-03-01', time: '16:00' }] },
        { id: 'SHIP-003', vehicle: 'MH-03-CD-9999', driver: 'Mohan Das', contact: '+91 7654321098', cargo: 'Sawn Timber', supplier: 'Assam Woods', origin: 'Guwahati', destination: 'Plot 15', dispatchDate: '2025-02-25', eta: 6, value: 1200000, freight: 35000, clearing: 4000, status: 'Arrived', gpsStatus: 'Active', syncStatus: 'Pending Unloading', delay: 0, timeline: [{ event: 'Dispatch', date: '2025-02-25', time: '06:00' }, { event: 'En route', date: '2025-02-27', time: '10:00' }, { event: 'Arrival', date: '2025-03-02', time: '09:30' }] }
    ],
    inventory: [
        { sku: 'PLY-001', product: 'Plywood 12mm', supplier: 'Tamil Nadu', spec: '12mm Grade A', location: 'Plot 10-A1', batch: 'BATCH-001', qty: 450, purchaseRate: 2000, purchaseValue: 900000, landedCost: 925000, sellingRate: 2200, margin: 100, daysInYard: 15, lastMovement: '2025-02-25', status: 'In Yard' },
        { sku: 'TIM-001', product: 'Teak Logs', supplier: 'Kerala Timber', spec: 'Grade A', location: 'Plot 12-B2', batch: 'BATCH-002', qty: 320, purchaseRate: 5000, purchaseValue: 1600000, landedCost: 1650000, sellingRate: 5500, margin: 500, daysInYard: 45, lastMovement: '2025-02-10', status: 'In Yard' },
        { sku: 'SAW-001', product: 'Sawn Timber', supplier: 'Assam Woods', spec: 'Pine Grade B', location: 'Plot 15-C3', batch: 'BATCH-003', qty: 280, purchaseRate: 3500, purchaseValue: 980000, landedCost: 1020000, sellingRate: 3900, margin: 400, daysInYard: 95, lastMovement: '2024-12-05', status: 'In Yard' }
    ]
};

const state = { view: 'dashboard' };

function loadNav() {
    const items = ['Dashboard', 'Transit Timeline', 'Inventory', 'Capital at Risk'];
    const html = items.map(item => `<div class="nav-item ${state.view === item.toLowerCase().replace(/ /g, '-') ? 'active' : ''}" onclick="switchView('${item.toLowerCase().replace(/ /g, '-')}')">${item}</div>`).join('');
    document.getElementById('nav').innerHTML = html;
}

function switchView(view) {
    state.view = view;
    loadNav();
    if (view === 'dashboard') renderDashboard();
    else if (view === 'transit-timeline') renderTransit();
    else if (view === 'inventory') renderInventory();
    else if (view === 'capital-at-risk') renderCapitalRisk();
}

function renderDashboard() {
    document.getElementById('pageTitle').textContent = 'Dashboard';
    const totalInvValue = db.inventory.reduce((s, i) => s + (i.qty * i.sellingRate), 0);
    const inTransit = db.shipments.filter(s => s.status === 'In Transit').length;
    const pendingUnload = db.shipments.filter(s => s.status === 'Arrived').length;
    const activeShipments = db.shipments.filter(s => s.status !== 'Completed').length;

    let html = `
        <div class="page-title">Dashboard</div>
        <div class="grid-4">
            <div class="card">
                <div class="card-label">Total Inventory Value</div>
                <div class="card-value">₹${(totalInvValue/100000).toFixed(1)}L</div>
                <div class="card-chart"></div>
                <div class="card-subtitle">Current Stock</div>
            </div>
            <div class="card">
                <div class="card-label">In Transit</div>
                <div class="card-value">${inTransit}</div>
                <div class="card-chart"></div>
                <div class="card-subtitle">Active Shipments</div>
            </div>
            <div class="card">
                <div class="card-label">Pending Unload</div>
                <div class="card-value">${pendingUnload}</div>
                <div class="card-chart"></div>
                <div class="card-subtitle">At Yard</div>
            </div>
            <div class="card">
                <div class="card-label">Active Shipments</div>
                <div class="card-value">${activeShipments}</div>
                <div class="card-chart"></div>
                <div class="card-subtitle">Total</div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 15px;">Recent Activity</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Shipment ID</th>
                            <th>Vehicle</th>
                            <th>Driver</th>
                            <th>Cargo</th>
                            <th>Value (₹)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    db.shipments.slice(0, 5).forEach(ship => {
        const statusClass = ship.status === 'In Transit' ? 'badge-transit' : ship.status === 'Delayed' ? 'badge-delayed' : ship.status === 'Arrived' ? 'badge-arrived' : 'badge-completed';
        html += `<tr><td><strong>${ship.id}</strong></td><td>${ship.vehicle}</td><td>${ship.driver}</td><td>${ship.cargo}</td><td>₹${ship.value.toLocaleString()}</td><td><span class="badge ${statusClass}">${ship.status}</span></td></tr>`;
    });

    html += `</tbody></table></div></div>`;
    document.getElementById('content').innerHTML = html;
}

function renderTransit() {
    document.getElementById('pageTitle').textContent = 'Transit Timeline';
    const active = db.shipments.filter(s => s.status !== 'Completed').length;
    const totalVal = db.shipments.reduce((s, x) => s + x.value, 0);
    const totalFrt = db.shipments.reduce((s, x) => s + x.freight, 0);
    const delayed = db.shipments.filter(s => s.delay > 0).length;
    const arrived = db.shipments.filter(s => s.status === 'Arrived').length;

    let html = `<div class="page-title">Transit Timeline</div><div class="control-strip"><div class="control-item"><div class="control-label">Active Shipments</div><div class="control-value">${active}</div></div><div class="control-item"><div class="control-label">Total Value</div><div class="control-value">₹${(totalVal/100000).toFixed(1)}L</div></div><div class="control-item"><div class="control-label">Total Freight</div><div class="control-value">₹${(totalFrt/1000).toFixed(0)}K</div></div><div class="control-item"><div class="control-label">Delayed Count</div><div class="control-value" style="color: #dc2626;">${delayed}</div></div><div class="control-item"><div class="control-label">Arriving Today</div><div class="control-value">${arrived}</div></div><div class="control-item"><div class="control-label">Unloading Pending</div><div class="control-value">0</div></div></div><div class="filter-bar"><div class="filter-group"><span class="filter-label">Origin:</span><select><option>All</option></select></div><div class="filter-group"><span class="filter-label">Status:</span><select><option>All</option><option>In Transit</option><option>Delayed</option><option>Arrived</option></select></div><div class="filter-group" style="flex: 1;"><input type="text" placeholder="Search vehicle / driver / invoice" style="flex: 1;"></div><button class="btn-primary" onclick="openDispatchModal()">+ Create Dispatch</button></div><div class="table-wrapper"><table><thead><tr><th>Shipment ID</th><th>Vehicle</th><th>Driver</th><th>Contact</th><th>Cargo</th><th>Supplier</th><th>Origin</th><th>Destination</th><th>Dispatch</th><th>ETA</th><th>Delay</th><th>Value (₹)</th><th>Freight (₹)</th><th>GPS</th><th>Status</th><th>Sync</th></tr></thead><tbody>`;

    db.shipments.forEach(ship => {
        const rowClass = ship.delay > 3 ? 'row-risk-high' : ship.delay > 0 ? 'row-risk-medium' : '';
        const statusBadge = ship.status === 'In Transit' ? 'badge-transit' : ship.status === 'Delayed' ? 'badge-delayed' : 'badge-arrived';
        html += `<tr class="${rowClass}" onclick="openShipmentDetail('${ship.id}')"><td><strong>${ship.id}</strong></td><td>${ship.vehicle}</td><td>${ship.driver}</td><td>${ship.contact}</td><td>${ship.cargo}</td><td>${ship.supplier}</td><td>${ship.origin}</td><td>${ship.destination}</td><td>${ship.dispatchDate}</td><td>${ship.eta}d</td><td>${ship.delay}d</td><td>₹${ship.value.toLocaleString()}</td><td>₹${ship.freight.toLocaleString()}</td><td><span class="badge ${ship.gpsStatus === 'Active' ? 'badge-completed' : 'badge-delayed'}">${ship.gpsStatus}</span></td><td><span class="badge ${statusBadge}">${ship.status}</span></td><td><span class="badge" style="background: #dbeafe; color: #1e40af;">Not Synced</span></td></tr>`;
    });

    html += `</tbody></table></div>`;
    document.getElementById('content').innerHTML = html;
}

function renderInventory() {
    document.getElementById('pageTitle').textContent = 'Inventory Management';
    const totalVal = db.inventory.reduce((s, i) => s + (i.qty * i.sellingRate), 0);
    const totalQty = db.inventory.reduce((s, i) => s + i.qty, 0);
    const old90 = db.inventory.filter(i => i.daysInYard > 90).reduce((s, i) => s + (i.qty * i.sellingRate), 0);
    const noMove30 = db.inventory.filter(i => i.daysInYard > 30).length;

    let html = `<div class="page-title">Inventory Management</div><div class="control-strip"><div class="control-item"><div class="control-label">Total Stock Value</div><div class="control-value">₹${(totalVal/100000).toFixed(1)}L</div></div><div class="control-item"><div class="control-label">Total Quantity</div><div class="control-value">${totalQty}</div></div><div class="control-item"><div class="control-label">In Transit</div><div class="control-value">0</div></div><div class="control-item"><div class="control-label">90+ Days</div><div class="control-value" style="color: #dc2626;">₹${(old90/100000).toFixed(1)}L</div></div><div class="control-item"><div class="control-label">No Move 30d</div><div class="control-value">${noMove30}</div></div><div class="control-item"><div class="control-label">Today Dispatch</div><div class="control-value">0</div></div></div><div class="filter-bar"><div class="filter-group"><span class="filter-label">Yard:</span><select><option>All</option><option>Plot 10</option><option>Plot 12</option><option>Plot 15</option></select></div><div class="filter-group"><span class="filter-label">Age:</span><select><option>All</option><option>0-30</option><option>31-60</option><option>61-90</option><option>90+</option></select></div><div class="filter-group" style="flex: 1;"><input type="text" placeholder="Search SKU / Batch" style="flex: 1;"></div></div><div class="table-wrapper"><table><thead><tr><th>SKU</th><th>Product</th><th>Spec</th><th>Supplier</th><th>Location</th><th>Batch</th><th>Qty</th><th>Purch Rate</th><th>Landed Cost</th><th>Selling Rate</th><th>Margin/Unit</th><th>Total Margin</th><th>Days</th><th>Last Move</th><th>Status</th></tr></thead><tbody>`;

    db.inventory.forEach(item => {
        const rowClass = item.daysInYard > 90 ? 'row-risk-high' : item.daysInYard > 60 ? 'row-risk-medium' : '';
        const margin = item.sellingRate - item.purchaseRate;
        html += `<tr class="${rowClass}"><td><strong>${item.sku}</strong></td><td>${item.product}</td><td>${item.spec}</td><td>${item.supplier}</td><td>${item.location}</td><td>${item.batch}</td><td>${item.qty}</td><td>₹${item.purchaseRate}</td><td>₹${(item.landedCost/item.qty).toFixed(0)}</td><td>₹${item.sellingRate}</td><td>₹${margin}</td><td>₹${(margin * item.qty).toLocaleString()}</td><td>${item.daysInYard}</td><td>${item.lastMovement}</td><td><span class="badge badge-completed">${item.status}</span></td></tr>`;
    });

    html += `</tbody></table></div><div class="alert-section"><div class="alert-title">⚠️ Action Required</div>`;
    const old120 = db.inventory.filter(i => i.daysInYard > 120);
    const move45 = db.inventory.filter(i => i.daysInYard > 45);
    if (old120.length > 0) html += `<div class="alert-item">Material 120+ days: ${old120.map(i => i.sku).join(', ')}</div>`;
    if (move45.length > 0) html += `<div class="alert-item">Zero movement 45+ days: ${move45.map(i => i.sku).join(', ')}</div>`;
    if (old120.length === 0 && move45.length === 0) html += `<div class="alert-item good">✓ All inventory in good status</div>`;
    html += `</div>`;

    document.getElementById('content').innerHTML = html;
}

function renderCapitalRisk() {
    document.getElementById('pageTitle').textContent = 'Capital at Risk';
    const inventory60Plus = db.inventory.filter(i => i.daysInYard >= 60);
    const totalRisk = inventory60Plus.reduce((s, i) => s + (i.qty * i.sellingRate), 0);
    const riskScore = inventory60Plus.length > 0 ? 74 : 10;

    let html = `
        <div class="page-title">Capital at Risk</div>
        <div style="font-size: 12px; color: #999; margin-bottom: 30px;">Automatic financial exposure detection based on live operational data</div>

        <div class="three-col">
            <div class="panel">
                <div class="panel-title">Overall Capital Risk Score</div>
                <div style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 900; color: #d97706; margin: 10px 0;">${riskScore}/100</div>
                    <div style="font-size: 12px; color: #d97706; font-weight: 600;">Risk Level: ${riskScore > 70 ? 'HIGH' : 'MEDIUM'}</div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-title">Capital Blocked (60+ days)</div>
                <div style="text-align: center;">
                    <div style="font-size: 28px; font-weight: 900; color: #dc2626; margin: 10px 0;">₹${(totalRisk/100000).toFixed(1)}L</div>
                    <div style="font-size: 12px; color: #666; font-weight: 600;">${inventory60Plus.length} lots at risk</div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-title">Inventory Risk</div>
                <div style="text-align: center;">
                    <div style="font-size: 28px; font-weight: 900; margin: 10px 0;">74%</div>
                    <div style="width: 100%; height: 8px; background: #f0f0f0; border-radius: 4px; margin: 10px 0; overflow: hidden;">
                        <div style="width: 74%; height: 100%; background: linear-gradient(to right, #fca5a5, #fdba74); border-radius: 4px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 15px;">Inventory Capital Exposure</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Product Name</th>
                            <th>Warehouse</th>
                            <th>Value (₹)</th>
                            <th>Days Old</th>
                            <th>% of Total</th>
                            <th>Risk Level</th>
                        </tr>
                    </thead>
                    <tbody>
    `;

    inventory60Plus.forEach((item, idx) => {
        const risk = item.daysInYard > 90 ? 'Days > 90' : 'Days > 60';
        const value = item.qty * item.sellingRate;
        html += `
            <tr>
                <td><strong>${item.sku}</strong></td>
                <td>${item.product}</td>
                <td>${item.location}</td>
                <td>₹${value.toLocaleString()}</td>
                <td>${item.daysInYard}</td>
                <td>45,000</td>
                <td><span class="badge ${item.daysInYard > 90 ? 'badge-delayed' : 'badge-arrived'}">${risk}</span></td>
            </tr>
        `;
    });

    html += `</tbody></table></div></div>`;
    document.getElementById('content').innerHTML = html;
}

function openDispatchModal() {
    document.getElementById('dispatchDate').valueAsDate = new Date();
    document.getElementById('dispatchModal').classList.add('show');
}

function closeDispatchModal() {
    document.getElementById('dispatchModal').classList.remove('show');
}

function saveDispatch() {
    const newShip = {
        id: `SHIP-${Math.floor(Math.random() * 10000)}`,
        vehicle: document.getElementById('dispatchVehicle').value,
        driver: document.getElementById('dispatchDriver').value,
        contact: document.getElementById('dispatchContact').value,
        cargo: document.getElementById('dispatchCargo').value,
        supplier: document.getElementById('dispatchSupplier').value,
        origin: document.getElementById('dispatchOrigin').value,
        destination: document.getElementById('dispatchDest').value,
        dispatchDate: document.getElementById('dispatchDate').value,
        eta: parseInt(document.getElementById('dispatchETA').value),
        value: parseFloat(document.getElementById('dispatchValue').value),
        freight: parseFloat(document.getElementById('dispatchFreight').value),
        clearing: parseFloat(document.getElementById('dispatchClearing').value),
        status: 'In Transit',
        gpsStatus: 'Active',
        syncStatus: 'Not Synced',
        delay: 0,
        timeline: [{ event: 'Dispatch', date: new Date().toISOString().split('T')[0], time: new Date().toLocaleTimeString() }]
    };
    db.shipments.push(newShip);
    closeDispatchModal();
    alert(`✓ Shipment ${newShip.id} created`);
    renderTransit();
}

function openShipmentDetail(id) {
    const ship = db.shipments.find(s => s.id === id);
    if (!ship) return;
    let html = `
        <div class="panel">
            <div class="panel-title">Shipment Details</div>
            <div class="detail-row"><span class="detail-label">ID</span><span class="detail-value">${ship.id}</span></div>
            <div class="detail-row"><span class="detail-label">Vehicle</span><span class="detail-value">${ship.vehicle}</span></div>
            <div class="detail-row"><span class="detail-label">Driver</span><span class="detail-value">${ship.driver}</span></div>
            <div class="detail-row"><span class="detail-label">Supplier</span><span class="detail-value">${ship.supplier}</span></div>
            <div class="detail-row"><span class="detail-label">Cargo Type</span><span class="detail-value">${ship.cargo}</span></div>
            <div class="detail-row"><span class="detail-label">Value</span><span class="detail-value">₹${ship.value.toLocaleString()}</span></div>
            <div class="detail-row"><span class="detail-label">Freight Cost</span><span class="detail-value">₹${ship.freight.toLocaleString()}</span></div>
            <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${ship.status}</span></div>
        </div>
        <div class="panel">
            <div class="panel-title">Route Information</div>
            <div class="detail-row"><span class="detail-label">Origin</span><span class="detail-value">${ship.origin}</span></div>
            <div class="detail-row"><span class="detail-label">Destination</span><span class="detail-value">${ship.destination}</span></div>
            <div class="detail-row"><span class="detail-label">Dispatch Date</span><span class="detail-value">${ship.dispatchDate}</span></div>
            <div class="detail-row"><span class="detail-label">ETA</span><span class="detail-value">${ship.eta} days</span></div>
            <div class="detail-row"><span class="detail-label">Current Delay</span><span class="detail-value" style="color: ${ship.delay > 0 ? '#dc2626' : '#15803d'}">${ship.delay} days</span></div>
            <div class="detail-row"><span class="detail-label">GPS Status</span><span class="detail-value">${ship.gpsStatus}</span></div>
        </div>
    `;
    document.getElementById('shipmentModalTitle').textContent = ship.id;
    document.getElementById('shipmentContent').innerHTML = html;
    document.getElementById('shipmentModal').classList.add('show');
}

function closeShipmentModal() {
    document.getElementById('shipmentModal').classList.remove('show');
}

loadNav();
renderDashboard();
</script>
