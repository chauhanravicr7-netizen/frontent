<!DOCTYPE html>
<html>
<head>
  <title>Dockside ERP</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; margin:0; }
    header { background:#1f3a8a; color:white; padding:15px; }
    h2 { margin:20px; }
    table { width:95%; margin:20px; border-collapse:collapse; background:white; }
    th, td { padding:10px; border:1px solid #ddd; text-align:left; }
    th { background:#f0f2f5; }
    tr:hover { background:#f9fafb; cursor:pointer; }
    .badge { padding:4px 8px; border-radius:4px; font-size:12px; color:white; }
    .Loading { background:#6b7280; }
    .InTransit { background:#2563eb; }
    .InPlot { background:#16a34a; }
    .Delivered { background:#059669; }
    .Delayed { background:#dc2626; }
    .card { background:white; padding:15px; margin:20px; border-radius:6px; }
    .flex { display:flex; gap:20px; }
    .modal {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.4);
      display:none;
      justify-content:center;
      align-items:center;
    }
    .modal-content {
      background:white;
      width:80%;
      padding:20px;
      border-radius:8px;
    }
    .close-btn { float:right; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>

<header>
  <h1>Dockside – Business Operating System</h1>
</header>

<h2>Inventory</h2>
<div id="inventoryView"></div>

<h2>Capital at Risk</h2>
<div id="riskView"></div>

<h2>Transit Timeline</h2>
<div id="transitView"></div>

<!-- Transit Detail Modal -->
<div id="transitModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">X</span>
    <div id="transitDetail"></div>
  </div>
</div>

<script>
/* =========================
   DATABASE
========================= */
const erpDatabase = {
  inventory: [
    { id:1, sku:"PLY-19MM", yard:"Mumbai", value:450000, quantity:120, daysInStock:95, stage:"In Plot" },
    { id:2, sku:"TIM-LOG-A", yard:"Kandla", value:820000, quantity:300, daysInStock:30, stage:"In Plot" },
    { id:3, sku:"VENEER-B", yard:"Surat", value:275000, quantity:200, daysInStock:140, stage:"In Plot" }
  ],
  transits: [
    {
      id:101,
      vehicleNumber:"GJ05AB1234",
      driverName:"Ramesh Patel",
      cargoType:"Timber Logs",
      supplierName:"Assam Timber Co.",
      origin:"Guwahati",
      destination:"Kandla Yard",
      dispatchDate:"2026-03-01",
      eta:"2026-03-05",
      status:"InTransit",
      freightCost:65000,
      loadValue:820000
    },
    {
      id:102,
      vehicleNumber:"MH04XY8890",
      driverName:"Imran Shaikh",
      cargoType:"Plywood Sheets",
      supplierName:"Kerala Plywood Ltd.",
      origin:"Kochi",
      destination:"Mumbai Yard",
      dispatchDate:"2026-02-25",
      eta:"2026-03-02",
      status:"Delivered",
      freightCost:48000,
      loadValue:450000
    }
  ]
};

/* =========================
   INVENTORY VIEW
========================= */
function renderInventory() {
  let html = "<table><tr><th>SKU</th><th>Yard</th><th>Value (₹)</th><th>Days In Stock</th><th>Stage</th></tr>";
  erpDatabase.inventory.forEach(item=>{
    html += `
      <tr>
        <td>${item.sku}</td>
        <td>${item.yard}</td>
        <td>₹${item.value.toLocaleString()}</td>
        <td>${item.daysInStock}</td>
        <td><span class="badge ${item.stage.replace(" ","")}">${item.stage}</span></td>
      </tr>
    `;
  });
  html += "</table>";
  document.getElementById("inventoryView").innerHTML = html;
}

/* =========================
   CAPITAL AT RISK
========================= */
function renderRisk() {
  const totalValue = erpDatabase.inventory.reduce((sum,i)=>sum+i.value,0);
  const riskyItems = erpDatabase.inventory.filter(i=>i.daysInStock > 90);
  const totalRiskValue = riskyItems.reduce((sum,i)=>sum+i.value,0);

  const riskScore = Math.min(100, Math.floor((totalRiskValue / totalValue) * 100));

  let html = `
    <div class="card">
      <h3>Overall Risk Score: ${riskScore} / 100</h3>
      <p>Total Inventory Value: ₹${totalValue.toLocaleString()}</p>
      <p>Capital Locked in 90+ Days Stock: ₹${totalRiskValue.toLocaleString()}</p>
    </div>
    <table>
      <tr>
        <th>SKU</th>
        <th>Value (₹)</th>
        <th>% of Capital</th>
        <th>Days In Stock</th>
      </tr>
  `;

  erpDatabase.inventory.forEach(item=>{
    const percent = ((item.value / totalValue) * 100).toFixed(2);
    html += `
      <tr>
        <td>${item.sku}</td>
        <td>₹${item.value.toLocaleString()}</td>
        <td>${percent}%</td>
        <td>${item.daysInStock}</td>
      </tr>
    `;
  });

  html += "</table>";
  document.getElementById("riskView").innerHTML = html;
}

/* =========================
   TRANSIT TIMELINE
========================= */
function renderTransit() {
  let html = `
    <table>
      <tr>
        <th>Vehicle No</th>
        <th>Driver</th>
        <th>Cargo</th>
        <th>Supplier</th>
        <th>Origin</th>
        <th>Destination</th>
        <th>ETA</th>
        <th>Status</th>
      </tr>
  `;

  erpDatabase.transits.forEach(item=>{
    html += `
      <tr onclick="openTransit(${item.id})">
        <td>${item.vehicleNumber}</td>
        <td>${item.driverName}</td>
        <td>${item.cargoType}</td>
        <td>${item.supplierName}</td>
        <td>${item.origin}</td>
        <td>${item.destination}</td>
        <td>${item.eta}</td>
        <td><span class="badge ${item.status}">${item.status}</span></td>
      </tr>
    `;
  });

  html += "</table>";
  document.getElementById("transitView").innerHTML = html;
}

/* =========================
   TRANSIT DETAIL MODAL
========================= */
function openTransit(id){
  const item = erpDatabase.transits.find(t=>t.id===id);

  const html = `
    <h3>Vehicle ${item.vehicleNumber}</h3>
    <div class="flex">
      <div style="flex:2;">
        <div style="background:#e5e7eb;height:250px;display:flex;align-items:center;justify-content:center;">
          Map Placeholder (${item.origin} → ${item.destination})
        </div>
      </div>
      <div style="flex:1;">
        <p><strong>Driver:</strong> ${item.driverName}</p>
        <p><strong>Cargo:</strong> ${item.cargoType}</p>
        <p><strong>Supplier:</strong> ${item.supplierName}</p>
        <p><strong>Dispatch Date:</strong> ${item.dispatchDate}</p>
        <p><strong>ETA:</strong> ${item.eta}</p>
        <p><strong>Freight Cost:</strong> ₹${item.freightCost.toLocaleString()}</p>
        <p><strong>Load Value:</strong> ₹${item.loadValue.toLocaleString()}</p>
        <p><strong>Status:</strong> ${item.status}</p>
      </div>
    </div>
  `;

  document.getElementById("transitDetail").innerHTML = html;
  document.getElementById("transitModal").style.display="flex";
}

function closeModal(){
  document.getElementById("transitModal").style.display="none";
}

/* =========================
   INITIAL RENDER
========================= */
renderInventory();
renderRisk();
renderTransit();
</script>

</body>
</html>
