<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCKSIDE | Timber & Plywood OS v7.1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #d97706; }
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f5; }
        .sidebar { width: 240px; background-color: #1a1a1a; height: 100vh; position: fixed; left: 0; top: 0; color: white; display: flex; flex-direction: column; z-index: 50; }
        .nav-item { padding: 12px 20px; color: #999; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { color: white; background: #252525; border-left-color: var(--accent); }
        .nav-item.active { background: var(--accent); }
        .main-container { margin-left: 240px; min-height: 100vh; display: flex; flex-direction: column; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e5e7eb; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal.show { display: flex; }
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-in-transit { background: #dbeafe; color: #1e40af; }
        .status-in-plot { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

<div id="loginScreen" class="fixed inset-0 flex z-[200]">
    <div class="flex-1 bg-neutral-900 text-white flex items-center justify-center p-12">
        <div class="max-w-md">
            <h1 class="text-6xl font-black mb-4 italic">DOCKSIDE</h1>
            <p class="text-neutral-400">Gandhidham Timber Hub | v7.1.0 Executive</p>
        </div>
    </div>
    <div class="flex-1 bg-gray-100 flex items-center justify-center p-12">
        <div class="bg-white p-10 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-black mb-2">Login</h2>
            <div class="space-y-4 mt-6">
                <div><label class="text-xs font-bold text-gray-500 uppercase">Email</label>
                <input type="email" id="loginEmail" class="w-full border p-3 rounded-lg mt-1" value="admin@dockside.com"></div>
                <div><label class="text-xs font-bold text-gray-500 uppercase">License</label>
                <input type="text" id="licenseNumber" class="w-full border p-3 rounded-lg mt-1" value="DS-2025-ADMIN-001"></div>
                <button onclick="handleLogin()" class="w-full bg-amber-600 text-white font-black py-4 rounded-lg uppercase tracking-widest hover:bg-amber-700 transition">Enter Terminal</button>
            </div>
        </div>
    </div>
</div>

<div id="mainApp" style="display: none;">
    <aside class="sidebar">
        <div class="p-6 border-b border-neutral-800">
            <div class="text-xl font-black italic">DOCKSIDE</div>
            <div id="userRoleDisplay" class="text-[10px] text-amber-500 font-bold mt-1 uppercase">ADMIN</div>
        </div>
        <nav class="flex-1 py-6" id="sidebarNav"></nav>
        <div class="p-6 border-t border-neutral-800">
            <button onclick="openAddLotModal()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg text-xs">+ ADD STOCK</button>
        </div>
    </aside>

    <main class="main-container">
        <header class="h-20 bg-white border-b flex items-center justify-between px-10">
            <div class="flex items-center gap-6">
                <h3 id="pageTitle" class="font-black uppercase text-sm tracking-tighter">Dashboard</h3>
                <input type="text" placeholder="Search SKU or Lot..." class="bg-gray-100 px-4 py-2 rounded-lg text-xs w-64 border-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right"><div id="userNameDisplay" class="text-xs font-bold">Admin</div><div class="text-[9px] text-green-500 font-bold">● SYSTEM LIVE</div></div>
                <div id="userInitial" class="w-10 h-10 bg-amber-600 rounded-full flex items-center justify-center font-black text-white">A</div>
            </div>
        </header>
        <div id="mainContent" class="p-10 overflow-y-auto"></div>
    </main>
</div>

<div id="addLotModal" class="modal">
    <div class="bg-white rounded-xl w-full max-w-2xl overflow-hidden shadow-2xl">
        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
            <h3 class="font-black uppercase tracking-tight">Create Timber Lot</h3>
            <button onclick="closeAddLotModal()" class="text-gray-400 hover:text-black text-2xl">×</button>
        </div>
        <div class="p-8 grid grid-cols-2 gap-6">
            <div class="col-span-2 flex gap-2">
                <button id="btnLog" onclick="setEntryType('log')" class="flex-1 border-2 border-amber-600 bg-amber-50 p-3 rounded-lg font-bold text-xs">🌳 LOG (Hoppus)</button>
                <button id="btnSawn" onclick="setEntryType('sawn')" class="flex-1 border-2 border-gray-200 p-3 rounded-lg font-bold text-xs">📏 SAWN</button>
                <button id="btnPly" onclick="setEntryType('plywood')" class="flex-1 border-2 border-gray-200 p-3 rounded-lg font-bold text-xs">📋 PLYWOOD</button>
            </div>
            <div><label class="text-[10px] font-bold text-gray-400 uppercase">Product Name</label>
            <input type="text" id="lotProductName" class="w-full border p-2 rounded mt-1 text-sm"></div>
            <div><label class="text-[10px] font-bold text-gray-400 uppercase">Warehouse</label>
            <select id="lotWarehouse" class="w-full border p-2 rounded mt-1 text-sm">
                <option>Plot 10 (North)</option><option>Plot 12 (Central)</option><option>Plot 15 (Port)</option>
            </select></div>
            <div id="calcFields" class="col-span-2 grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
                <div><label class="text-[10px] font-bold text-gray-400 uppercase">Length (ft)</label>
                <input type="number" id="valL" class="w-full border p-2 rounded mt-1 text-sm" oninput="runCalculator()"></div>
                <div><label id="labelW" class="text-[10px] font-bold text-gray-400 uppercase">Girth (in)</label>
                <input type="number" id="valW" class="w-full border p-2 rounded mt-1 text-sm" oninput="runCalculator()"></div>
            </div>
            <div><label class="text-[10px] font-bold text-gray-400 uppercase">Final Qty (CBM/SqFt)</label>
            <input type="number" id="lotQuantity" class="w-full border p-2 rounded mt-1 text-sm bg-gray-100 font-bold" readonly></div>
            <div><label class="text-[10px] font-bold text-gray-400 uppercase">Rate (₹)</label>
            <input type="number" id="lotRate" class="w-full border p-2 rounded mt-1 text-sm"></div>
        </div>
        <div class="p-6 border-t flex justify-end gap-3 bg-gray-50">
            <button onclick="closeAddLotModal()" class="px-6 py-2 text-xs font-bold text-gray-500 uppercase">Cancel</button>
            <button onclick="saveLot()" class="px-8 py-2 bg-amber-600 text-white rounded-lg text-xs font-black uppercase">Create Lot</button>
        </div>
    </div>
</div>

<script>
    let erpDatabase = { inventory: [] };
    let state = { authenticated: false, currentView: 'dashboard', userRole: 'admin', currentType: 'log' };

    // --- FIX 1: RESTORE LOGIN & SIDEBAR ---
    function handleLogin() {
        const license = document.getElementById('licenseNumber').value;
        const valid = {'DS-2025-ADMIN-001': 'admin', 'DS-2025-EMPLOYEE-002': 'employee'};
        if (valid[license]) {
            state.authenticated = true;
            state.userRole = valid[license];
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('userRoleDisplay').textContent = state.userRole;
            renderSidebar();
            switchView('dashboard');
        } else { alert("Invalid License"); }
    }

    function renderSidebar() {
        const menu = state.userRole === 'admin' 
            ? ['Dashboard', 'Inventory', 'Capital at Risk', 'Transit Timeline'] 
            : ['Dashboard', 'Inventory'];
        document.getElementById('sidebarNav').innerHTML = menu.map(m => `
            <div class="nav-item ${state.currentView === m.toLowerCase() ? 'active' : ''}" onclick="switchView('${m.toLowerCase()}')">${m}</div>
        `).join('');
    }

    function switchView(view) {
        state.currentView = view;
        document.getElementById('pageTitle').textContent = view;
        renderSidebar();
        if (view === 'dashboard') renderDashboard();
        else if (view === 'inventory') renderInventory();
        else if (view === 'capital-at-risk') renderCapitalAtRisk();
    }

    // --- FIX 2: REBUILD TALLY ENGINE ---
    function setEntryType(type) {
        state.currentType = type;
        const btns = {log: 'btnLog', sawn: 'btnSawn', plywood: 'btnPly'};
        Object.values(btns).forEach(b => document.getElementById(b).className = "flex-1 border-2 border-gray-200 p-3 rounded-lg font-bold text-xs");
        document.getElementById(btns[type]).className = "flex-1 border-2 border-amber-600 bg-amber-50 p-3 rounded-lg font-bold text-xs";
        document.getElementById('labelW').textContent = type === 'log' ? 'Girth (in)' : (type === 'plywood' ? 'Width (ft)' : 'Width (in)');
        runCalculator();
    }

    function runCalculator() {
        const l = parseFloat(document.getElementById('valL').value) || 0;
        const w = parseFloat(document.getElementById('valW').value) || 0;
        let qty = 0;
        if (state.currentType === 'log') qty = (Math.pow(w/4, 2) * l) / 144; // Hoppus
        else if (state.currentType === 'plywood') qty = l * w; // SqFt
        document.getElementById('lotQuantity').value = qty.toFixed(3);
    }

    // --- FIX 3: RENDER DASHBOARD (THE EXECUTIVE COMMAND STRIP) ---
    function renderDashboard() {
        const inv = erpDatabase.inventory;
        const totalVal = inv.reduce((s, i) => s + (i.quantity * i.rate), 0);
        document.getElementById('mainContent').innerHTML = `
            <div class="grid grid-cols-4 gap-6 mb-10">
                <div class="card"><div class="text-[10px] font-black text-gray-400 uppercase mb-2">Total Inventory Value</div>
                <div class="text-3xl font-black italic">₹${(totalVal/100000).toFixed(2)}L</div></div>
                <div class="card"><div class="text-[10px] font-black text-gray-400 uppercase mb-2">Active Lots</div>
                <div class="text-3xl font-black">${inv.length}</div></div>
                <div class="card border-l-4 border-red-500"><div class="text-[10px] font-black text-gray-400 uppercase mb-2 text-red-500">Capital at Risk</div>
                <div class="text-3xl font-black text-red-600">₹0.00L</div></div>
                <div class="card"><div class="text-[10px] font-black text-gray-400 uppercase mb-2">Fleet Availability</div>
                <div class="text-3xl font-black">100%</div></div>
            </div>
            <div class="card"><h4 class="font-black uppercase mb-6 text-xs">Recent Movements</h4>
            <table class="w-full text-left text-xs">
                <thead><tr class="text-gray-400 border-b"><th class="pb-4">LOT #</th><th class="pb-4">PRODUCT</th><th class="pb-4">QTY</th><th class="pb-4">STATUS</th></tr></thead>
                <tbody>${inv.map(i => `<tr class="border-b"><td class="py-4 font-bold">${i.id}</td><td>${i.productName}</td><td>${i.quantity} ${i.unit}</td><td><span class="status-badge status-in-plot">In Plot</span></td></tr>`).join('')}</tbody>
            </table></div>`;
    }

    // --- MODAL CONTROLS ---
    function openAddLotModal() { document.getElementById('addLotModal').classList.add('show'); }
    function closeAddLotModal() { document.getElementById('addLotModal').classList.remove('show'); }
    
    function saveLot() {
        const lot = {
            id: 'LOT-' + Date.now().toString().slice(-4),
            productName: document.getElementById('lotProductName').value,
            quantity: parseFloat(document.getElementById('lotQuantity').value),
            rate: parseFloat(document.getElementById('lotRate').value) || 0,
            unit: state.currentType === 'plywood' ? 'SqFt' : 'CBM',
            createdAt: new Date().toISOString()
        };
        erpDatabase.inventory.push(lot);
        closeAddLotModal();
        renderDashboard();
    }
</script>
</body>
</html>
